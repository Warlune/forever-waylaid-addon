name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test && pnpm check
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 tests/addon.lua
      - run: node tools/build-recipes.mjs && git diff --exit-code -- ForeverWaylaid/Catalog.lua ForeverWaylaid/Recipes.lua
      - run: node tools/build-roads.mjs && git diff --exit-code -- ForeverWaylaid/WorldRoadData.lua
      - name: Package both addons separately
        run: |
          node tools/package-addon.mjs
          for addon in ForeverWaylaid ForeverCompanions; do
            version=$(sed -n 's/^## Version: //p' "$addon/$addon.toc" | tr -d '\r')
            (cd release/stage && zip -r "../$addon-$version.zip" "$addon")
            python3 tools/check-package.py "release/$addon-$version.zip" "$addon"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: beta-addons
          path: release/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beta-addons
          path: release
      - name: Publish beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --verify-tag --title "$GITHUB_REF_NAME beta" --notes-file RELEASE_NOTES.md --prerelease
